name: Dodge Social Auto-Poster

on:
  schedule:
    - cron: '0 14 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log payloads without posting)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Run Dodge Auto-Poster
        env:
          GAME_URL: "https://dodge.saas-build09.workers.dev"
          DEV_HANDLE: "@DodgeGameDev"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_MONTHLY_CAP: ${{ secrets.X_MONTHLY_CAP }}
        run: |
          python scripts/autopost.py

      - name: Commit updated queue state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/state.json
          git diff --staged --quiet || git commit -m "chore(autopost): advance queue state [skip ci]"
          git push
